name: Tests

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        laravel: [10, 11, 12, 13]
        include:
          - laravel: 10
            testbench: ^8.0
            php: 8.2
          - laravel: 11
            testbench: ^9.0
            php: 8.2
          - laravel: 12
            testbench: ^10.0
            php: 8.2
          - laravel: 13
            testbench: ^11.0
            php: 8.3

    name: "Laravel ${{ matrix.laravel }} (PHP ${{ matrix.php }}, Testbench ${{ matrix.testbench }})"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit